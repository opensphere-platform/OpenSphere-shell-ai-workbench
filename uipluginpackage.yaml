apiVersion: plugins.opensphere.io/v1alpha1
kind: UIPluginPackage
metadata:
  name: ai-workbench
  namespace: opensphere-system
spec:
  kind: subShell
  hostRef: main
  hostApiVersion: "1.0.0"
  hostCompat: ">=1.0.0 <2.0.0"
  displayName: "AI-Workbench"
  owner: platform-experience
  version: 1.1.2
  description: "CONSTITUTION-0003 Production subShell reference for OpenSphere AI operations"
  serviceAccountName: ai-runtime
  podLabels:
    pipelines.kubeflow.org/v2_component: "true"
  env:
    - name: OSP_ADMIN_GROUPS
      value: "opensphere-console-admins,opensphere-admins,system:masters,cluster-admins"
    - name: CONSOLE_IDENTITY_URL
      value: "http://opensphere-console-backend.opensphere-console.svc.cluster.local:8080"
  # 정본 설치 경로는 `os extensions install`이며 Controller가 image inspection으로
  # Package를 합성한다. 아래 repository/digest와 manifest.sha256은 이 정적 manifest를
  # 직접 apply할 때만 쓰는 값으로, 매 release의 exact digest로 교체해야 한다.
  image:
    repository: opensphere-shell-ai-workbench
    digest: sha256:a65af5151f049ad3b1dbd070a2f7a05d89779226f8736814170ba11d32a9e613
  nav:
    band: "Operate"
    label: "AI-Workbench"
  manifest:
    path: /plugins/ui-shell.manifest.json
    sha256: "005111dfb5cb6b7d6348e8e921baa3ae8cf13aca58e8c776e61db1f4abb32b6a"
    signaturePath: /plugins/ui-shell.manifest.json.sig
  trust:
    keyId: opensphere-plugins-v1
  shellCompat: ">=0.2.0 <0.9.0"
  permissions:
    - page:register
    - api:proxy
    - nav:contribute
    - search:contribute
    - manual:contribute
    - notify:publish
  api:
    basePath: /api/plugins/ai-workbench
  cli:
    namespace: ai-workbench
    manifestPath: /admin/native/agent-tools
  contributions:
    page: { enabled: true }
    navigation: { enabled: true, mode: "runtime" }
    api: { enabled: true, basePath: "/api/plugins/ai-workbench" }
    cli: { enabled: true, namespace: "ai-workbench", manifestPath: "/admin/native/agent-tools" }
    manual: { enabled: true, sourceId: "opensphere-ai-hub", mode: "runtime" }
    search: { enabled: true, mode: "runtime" }
    notification: { enabled: true, frontend: true, backend: true }
    observability: { enabled: true, logs: true, metrics: true, traces: true }
---
apiVersion: plugins.opensphere.io/v1alpha1
kind: UIPluginRegistration
metadata:
  name: ai-workbench
  namespace: opensphere-system
spec:
  packageRef:
    name: ai-workbench
  desiredState: Enabled
  installPolicy:
    createWorkload: true
    createProxyRoute: false
    exposeInNavigation: true
  approval:
    requestedBy: cmars
    reason: "CONSTITUTION-0003 Production subShell reference deployment"
